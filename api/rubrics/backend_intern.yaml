role_title: Backend engineering intern
skills:
  - key: backend_depth
    name: Backend fundamentals
    weight: 1.0
    what_good_looks_like: >
      Names the database and framework they personally chose and gives the reason
      that decided it. Describes one thing that broke and how they diagnosed it,
      not just that it was fixed.

  - key: api_design
    name: API and data modelling
    weight: 1.0
    what_good_looks_like: >
      Describes one endpoint they designed with its request and response shape,
      why the tables are split the way they are, and one error or edge case they
      handled. Bonus: a migration, N+1, or nullable-column that bit them.

  - key: ai_agents
    name: LLM and agent concepts
    weight: 1.0
    what_good_looks_like: >
      Can say whether what they built decided its own next step or ran fixed
      steps, and knows the difference. If they claim RAG, names a chunking choice
      and what went wrong with the first attempt.

  - key: ownership
    name: Ownership and debugging
    weight: 1.0
    what_good_looks_like: >
      A first-person story of something that broke, the wrong hypothesis they
      chased first, how they narrowed it, and what they changed. Passive voice and
      unnamed teams are the tell of a weak answer.

  - key: communication
    name: Technical communication
    weight: 0.5
    cross_cutting: true
    what_good_looks_like: >
      Across the whole conversation: gives the reason before the detail, uses
      plain words for hard things, and says "I don't know" instead of bluffing.
      Structure and honesty only -- never fluency, accent or speed.
