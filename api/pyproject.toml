[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.agent"]

[project]
name = "screenr-api"
version = "0.1.0"
description = "Agentic interviewer backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "pyyaml>=6.0",
    "pypdf>=5.1",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "websockets>=13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
gemini = ["langchain-google-genai>=2.0"]
anthropic = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() in defaults is the framework's own idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["evals", "tests"]
